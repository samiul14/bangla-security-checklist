<script>
const SECTIONS=[{"icon":"🔐","title":"লগইন সুরক্ষা","items":[{"pr":"জরুরি","t":"শক্তিশালী পাসওয়ার্ড ব্যবহার করো","d":"১২+ অক্ষরের লম্বা পাসওয়ার্ড বানাও — কয়েকটা শব্দ জোড়া দিলেই (যেমন “nil-akas-bristy-42!”) মনে রাখা সহজ, ভাঙা কঠিন। নাম-ঠিকানা-জন্মতারিখ দিও না।"},{"pr":"জরুরি","t":"এক পাসওয়ার্ড সব জায়গায় দিও না","d":"একটা সাইট লিক হলে চোর সেই পাসওয়ার্ড দিয়ে তোমার বাকি account-গুলোতেও ঢোকার চেষ্টা করবে। প্রতিটা account-এ আলাদা পাসওয়ার্ড রাখো।"},{"pr":"জরুরি","t":"Password manager ব্যবহার করো","d":"শত শত পাসওয়ার্ড মনে রাখা অসম্ভব — Bitwarden (ফ্রি) বা KeePassDX-এ সব encrypted থাকবে। শুধু একটা শক্ত master password মনে রাখলেই হবে, ফোন-PC সব জায়গায় auto-fill হবে।"},{"pr":"জরুরি","t":"পাসওয়ার্ড কারো সাথে শেয়ার কোরো না","d":"পাসওয়ার্ড শেয়ার করলেই account-এর risk বাড়ে। একান্ত দরকার হলে password manager-এর built-in sharing feature ব্যবহার করো, মেসেজে পাঠিও না।"},{"pr":"জরুরি","t":"2FA চালু করো","d":"পাসওয়ার্ডের পাশাপাশি ফোনের authenticator app-এর কোড লাগবে — পাসওয়ার্ড চুরি হলেও কেউ ঢুকতে পারবে না। Google/Microsoft Authenticator install করে account settings থেকে চালু করো (ইন্টারনেট ছাড়াই কাজ করে)।"},{"pr":"জরুরি","t":"Backup code নিরাপদে রাখো","d":"2FA চালু করলে যে backup code দেয়, সেগুলো কাগজে লিখে নিরাপদ জায়গায় রাখো — ফোন হারালে এগুলোই ভরসা। Password manager-এ রেখো না।"},{"pr":"ঐচ্ছিক","t":"Breach alert-এ সাইন আপ করো","d":"HaveIBeenPwned-এ “Notify me” চালু রাখো — তোমার email কোনো data leak-এ এলে সাথে সাথে জানতে পারবে, তখন পাসওয়ার্ড বদলে নিও।"},{"pr":"ঐচ্ছিক","t":"পাসওয়ার্ড টাইপের সময় আড়াল করো","d":"পাবলিক জায়গায় টাইপ করার সময় খেয়াল রেখো কেউ কাঁধের ওপর দিয়ে দেখছে কিনা, CCTV-র সামনে আছো কিনা। হাত দিয়ে আড়াল করে টাইপ করো।"},{"pr":"ঐচ্ছিক","t":"গুরুত্বপূর্ণ পাসওয়ার্ড মাঝে মাঝে বদলাও","d":"Leak তো হতেই থাকে — বছরে একবার গুরুত্বপূর্ণ account-এর পাসওয়ার্ড বদলে নাও। তবে সব পাসওয়ার্ড লম্বা ও আলাদা হলে বারবার বদলানোর দরকার নেই।"},{"pr":"ঐচ্ছিক","t":"Browser-এ পাসওয়ার্ড সেভ কোরো না","d":"Browser-এর saved password সবসময় encrypted থাকে না — ফোন/PC হাত       const okQ=(!query||txt.includes(query));
      const show=okF&&okQ;
      el.style.display=show?"":"none";
      if(show)vis++;
    });
    sec.style.display=vis?"":"none";
  });
  const anyVis=[...document.querySelectorAll(".sec")].some(s=>s.style.display!=="none");
  let e=document.getElementById("nores");
  if(!anyVis&&!e){e=document.createElement("div");e.id="nores";e.className="empty";e.textContent="কিছু পাওয়া যায়নি — অন্য কিছু লিখে খুঁজো";main.appendChild(e);}
  if(anyVis&&e)e.remove();
}
document.getElementById("filters").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");filter=b.dataset.f;applyFilter();
};
document.getElementById("q").oninput=e=>{query=e.target.value.trim().toLowerCase();applyFilter();};
function update(){
  const n=Object.keys(done).length;
  document.getElementById("pfill").style.width=(total?Math.round(n/total*100):0)+"%";
  document.getElementById("ptxt").textContent=n+" / "+total+" সম্পন্ন";
}
document.getElementById("reset").onclick=()=>{if(confirm("সব tick মুছে ফেলবে?")){done={};localStorage.removeItem(KEY);document.querySelectorAll(".item.done").forEach(e=>e.classList.remove("done"));update();}};
applyFilter();update();
</script>
</body>
